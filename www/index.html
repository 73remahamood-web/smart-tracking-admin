<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no,
    viewport-fit=cover"
>

<title>SmartTrack Admin</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app">

<header>

    <div class="badge">

        <span
            id="scanDot"
            class="dot"
        ></span>

        <span id="scanStatus">
            الرادار متوقف
        </span>

    </div>

    <h1>
        SmartTrack Admin
    </h1>

    <p>
        رادار BLE لاكتشاف مستخدمي SmartTrack
    </p>

</header>


<section class="controls">

    <button
        id="startButton"
        class="primary"
    >
        تشغيل الرادار
    </button>


    <button
        id="stopButton"
        class="secondary hidden"
    >
        إيقاف الرادار
    </button>

</section>


<div class="info">

    <span>
        الأجهزة:
        <strong id="deviceCount">
            0
        </strong>
    </span>

    <span>
        SmartTrack BLE
    </span>

</div>


<div
    id="errorBox"
    class="error hidden"
></div>


<div
    id="usersList"
    class="users"
></div>


<div
    id="emptyState"
    class="empty"
>
    شغّل الرادار للبحث عن مستخدمي SmartTrack.
</div>


<footer>
    SmartTrack Admin BLE v3
</footer>

</div>

<script src="cordova.js"></script>
<script src="js/app.js"></script>

</body>

</html>
